<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>診断中...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/loading.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/animation.css') }}">
</head>
<body class="loading-page">

<div class="loading-container">
    <h2>診断中...</h2>
    <p class="loading-text">現在地情報を取得しています</p>

    <!-- 進捗エリア -->
    <div class="progress-wrapper">
        <div class="car">🚗</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-percent" id="progressPercent">0%</div>
    </div>

    <!-- フォーム -->
    <form id="sendForm" action="/result" method="POST">
        <input type="hidden" name="time" id="time">
        <input type="hidden" name="age" id="age">
        <input type="hidden" name="vehicle" id="vehicle">
        <input type="hidden" name="weather" id="weather">
        <input type="hidden" name="lat" id="lat">
        <input type="hidden" name="lng" id="lng">
    </form>
</div>

<script>
    window.onload = function() {

        const params = new URLSearchParams(location.search);
        time.value = params.get("time");
        age.value = params.get("age");
        vehicle.value = params.get("vehicle");
        weather.value = params.get("weather");

        let progress = 0;
        const bar = document.getElementById("progressFill");
        const percent = document.getElementById("progressPercent");
        const car = document.querySelector(".car");

        const timer = setInterval(() => {
            if (progress < 90) {
                progress += 1;
                bar.style.width = progress + "%";
                percent.textContent = progress + "%";
                car.style.left = `calc(${progress}% - 12px)`;
            }
        }, 40);

        navigator.geolocation.getCurrentPosition(
            async (pos) => {
                lat.value = pos.coords.latitude.toFixed(6);
                lng.value = pos.coords.longitude.toFixed(6);

                await fetch("/prepare_accidents", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        lat: lat.value,
                        lng: lng.value
                    })
                });

                // 完了表示
                clearInterval(timer);
                bar.style.width = "100%";
                percent.textContent = "100%";
                car.style.left = "calc(100% - 12px)";

                // 処理完了後に遷移
                setTimeout(() => {
                    document.getElementById("sendForm").submit();
                }, 300);
            },
            () => {
                alert("位置情報取得に失敗しました。");
                location.href = "/";
            }
        );
    };
</script>


</body>
</html>
