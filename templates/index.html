<!DOCTYPE html>
<html lang="ja">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あんしんどらいぶくん - 運転診断</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #4facfe;
            --secondary-color: #00f2fe;
            --accent-color: #ff9a9e;
            --text-color: #333;
            --bg-color: #f0f4f8;
        }

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        .header-icon {
            font-size: 60px;
            margin-bottom: 10px;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            color: #2c3e50;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        hr {
            border: 0;
            height: 1px;
            background: #eee;
            margin: 20px 0;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }

        label span {
            margin-right: 5px;
        }

        select {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background-color: #fff;
            color: #000; 
            font-weight: 500;
            cursor: pointer;
            transition: border-color 0.3s, box-shadow 0.3s;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234facfe' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 16px;
        }

        select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.2);
        }

        select:invalid {
            color: #555;
        }

        option {
            color: #000;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="header-icon">🚗💨</div>
        <h1>あんしんどらいぶくん</h1>
        <p class="subtitle">いくつかの質問に答えるだけ！<br>AIがあなたの運転リスクをサクッと診断します。</p>

        <form action="/loading" method="GET">
            
            <div class="form-group">
                <label for="time"><span>⏰</span>運転する時間帯</label>
                <select name="time" id="time" required>
                    <option value="" disabled selected>選択してください</option>
                    <option value="早朝">早朝 (5:00 - 8:00)</option>
                    <option value="午前">午前 (8:00 - 12:00)</option>
                    <option value="午後">午後 (12:00 - 16:00)</option>
                    <option value="夕方">夕方 (16:00 - 19:00)</option>
                    <option value="夜">夜 (19:00 - 23:00)</option>
                    <option value="深夜">深夜 (23:00 - 5:00)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="age"><span>🎂</span>年齢</label>
                <select name="age" id="age" required>
                    <option value="" disabled selected>選択してください</option>
                    <option value="10代">10代</option>
                    <option value="20代">20代</option>
                    <option value="30代">30代</option>
                    <option value="40代">40代</option>
                    <option value="50代">50代</option>
                    <option value="60代以上">60代以上</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="gender"><span>🚻</span>性別</label>
                <select name="gender" required>
                    <option value="" disabled selected>選択してください</option>
                    <option value="男性">男性</option>
                    <option value="女性">女性</option>
                    </select>
            </div>

        <!--🟥↑genderを消してこのコメントアウトを解除してvehecleに変更
        <div class="form-group">
                <label for="car_type"><span>🚗</span>車種</label>
                <select name="car_type" id="car_type" required>
                    <option value="" disabled selected>選択してください</option>
                    <option value="乗用車">乗用車</option>
                    <option value="貨物車">貨物車（トラックなど）</option>
                    <option value="バイク">バイク（原付含む）</option>
                    <option value="自転車">自転車</option>
                </select>
            </div>
        -->

            <div class="form-group">
                <label for="weather"><span>⛅</span>天候</label>
                <select name="weather" id="weather" required>
                    <option value="" disabled selected>選択してください</option>
                    <option value="晴れ">晴れ</option>
                    <option value="曇り">曇り</option>
                    <option value="雨">雨</option>
                    <option value="雷">雷</option>
                    <option value="雪">雪</option>
                    <option value="濃霧">濃霧</option>
                </select>
            </div>

            <hr>

            <button type="submit">診断する！</button>
        </form>
    </div>
</body>
</html>
