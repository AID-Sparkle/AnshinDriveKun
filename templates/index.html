<!DOCTYPE html>
<html lang="ja">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あんしんどらいぶくん - 運転診断</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/animation.css') }}">


    
</head>
<body>
    <div class="container">
        <div class="header-icon">🚗💨</div>
        <h1>あんしんどらいぶくん</h1>
        <p class="subtitle">いくつかの質問に答えるだけ！<br>あなたの運転リスクをサクッと診断します。</p>

        <form action="/loading" method="GET">
            
            <div class="form-group">
                <label for="time"><span>⏰</span>運転する時間帯</label>
                <select name="time" id="time" required>
                    <option value="" disabled selected>選択してください</option>
                    <option value="早朝">早朝 (5:00 - 8:00)</option>
                    <option value="午前">午前 (8:00 - 12:00)</option>
                    <option value="午後">午後 (12:00 - 16:00)</option>
                    <option value="夕方">夕方 (16:00 - 19:00)</option>
                    <option value="夜">夜 (19:00 - 23:00)</option>
                    <option value="深夜">深夜 (23:00 - 5:00)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="age"><span>🎂</span>年齢</label>
                <select name="age" id="age" required>
                    <option value="" disabled selected>選択してください</option>
                    <option value="10代">10代</option>
                    <option value="20代">20代</option>
                    <option value="30代">30代</option>
                    <option value="40代">40代</option>
                    <option value="50代">50代</option>
                    <option value="60代以上">60代以上</option>
                </select>
            </div>         

        <div class="form-group">
                <label for="vehicle"><span>🚗</span>車種</label>
                <select name="vehicle" id="vehicle" required>
                    <option value="" disabled selected>選択してください</option>
                    <option value="乗用車">乗用車</option>
                    <option value="貨物車">貨物車（トラックなど）</option>
                    <option value="バイク">バイク（原付含む）</option>
                    <option value="自転車">自転車</option>
                </select>
            </div>
       

            <div class="form-group">
                <label for="weather"><span>⛅</span>天候</label>
                <select name="weather" id="weather" required>
                    <option value="" disabled selected>選択してください</option>
                    <option value="晴れ">晴れ</option>
                    <option value="曇り">曇り</option>
                    <option value="雨">雨</option>
                    <option value="雪">雪</option>
                    <option value="霧">霧</option>
                </select>
            </div>

            <hr>

            <button type="submit">診断する！</button>
        </form>
    </div>
</body>
</html>
