<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>あんしんどらいぶくん - 質問入力</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin: 50px;
        }
        select, button {
            margin: 10px;
            padding: 8px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>あんしんどらいぶくん</h1>
    <p>いくつかの質問から<br>あなたの運転リスクを診断します</p>
    <p>以下の項目を選択してください：</p>

    <!-- 🚗 送信先を /loading に変更 (GET方式) -->
    <form action="/loading" method="GET">

        <label>運転する時間帯：</label>
        <select name="time" required>
            <option value="">選択してください</option>
            <option value="早朝(4:00~7:00)">早朝(4:00~7:00)</option>
            <option value="午前(7:00~12:00)">午前(7:00~12:00)</option>
            <option value="午後(12:00~16:00)">午後(12:00~16:00)</option>
            <option value="夕方(16:00~18:00)">夕方(16:00~18:00)</option>
            <option value="夜(18:00~22:00)">夜(18:00~22:00)</option>
            <option value="深夜(22:00~4:00)">深夜(22:00~4:00)</option>
        </select><br>

        <label>年齢：</label>
        <select name="age" required>
            <option value="">選択してください</option>
            <option value="18～24歳">18～24歳</option>
            <option value="25～34歳">25～34歳</option>
            <option value="35～44歳">35～44歳</option>
            <option value="45～54歳">45～54歳</option>
            <option value="55～64歳">55～64歳</option>
            <option value="65～74歳">65～74歳</option>
            <option value="75歳以上">75歳以上</option>
        </select><br>

        <label>性別：</label>
        <select name="gender" required>
            <option value="">選択してください</option>
            <option value="男性">男性</option>
            <option value="女性">女性</option>
        </select><br>

        <label>天候：</label>
        <select name="weather" required>
            <option value="">選択してください</option>
            <option value="晴れ">晴れ</option>
            <option value="曇り">曇り</option>
            <option value="雨">雨</option>
            <option value="雪">雪</option>
            <option value="霧">霧</option>
        </select><br>

        <button type="submit">診断開始</button>
    </form>
</body>
</html>
