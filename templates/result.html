<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>診断結果 - あんしんどらいぶくん</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/result.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/animation.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="result-page">
<!--
    テスト用：緯度経度表示（本番で削除可）
    <h3>（テスト表示）取得した現在位置：</h3>
    <p id="coords">位置情報取得中…</p>

    小数点削除後の緯度経度（CSV形式用）
    <li><strong>緯度（CSV形式）:</strong> {{ lat_clean }}</li>
    <li><strong>経度（CSV形式）:</strong> {{ lng_clean }}</li>
-->

    <div class="container">
        <h1>🔍 診断結果</h1>
        <p>以下の条件で分析しました</p>

        <ul class="info-list">
            <li>⏰ 時間帯： {{ time }}</li>
            <li>🎂 年齢　： {{ age }}</li>
            <li>🚻 性別　： {{ gender }}</li>
            <li>⛅ 天候　： {{ weather }}</li>
        </ul>

        <div class="result-box">
            <h2>あなたの運転リスク診断</h2>
            <div class="score-label">危険度スコア</div>
            <div class="score">{{ score }}点</div>
            <div class="advice">
                <strong>【AIからのアドバイス】</strong><br>
                {{ message | safe }}
            </div>
        </div>

        <h2 class="section-title">📊 事故発生件数データ</h2>
        <p style="font-size: 14px; color: #666;">同条件での時間帯別事故件数（過去データ）</p>
        <div class="chart-container">
            <canvas id="myChart"></canvas>
        </div>

        <h2 class="section-title">📍 あなたの現在地周辺</h2>
        <div id="map"></div>
        <p style="font-size:12px; color:#999; margin-top:10px;">※取得した位置情報を表示しています</p>

        <a href="/" class="btn-back">もう一度診断する</a>
    </div>

    <script>
        function initMap() {
            //マップ初期位置(皇居周辺)
            const lat = Number("{{ lat }}") || 35.685175;
            const lng = Number("{{ lng }}") || 139.7528;
            const myLocation = { lat: lat, lng: lng };
            
            const mapOptions = { zoom: 15, center: myLocation };
            const map = new google.maps.Map(document.getElementById("map"), mapOptions);
            new google.maps.Marker({ position: myLocation, map: map, title: "現在地" });
        }
    </script>
    <script async src="https://maps.googleapis.com/maps/api/js?key={{ api_key }}&callback=initMap"></script>

    <script>
        // Pythonから渡されたデータを受け取る
        const chartLabels = {{ chart_labels | tojson }};
        const chartData = {{ chart_data | tojson }};
        
        // データがあるか確認
        const totalCount = chartData.reduce((sum, num) => sum + num, 0);

        if (totalCount >= 0) { // データ0件でもグラフ枠は表示する
            const ctx = document.getElementById('myChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: chartLabels.map(h => h + '時'),
                    datasets: [{
                        label: '事故件数',
                        data: chartData,
                        backgroundColor: 'rgba(79, 172, 254, 0.6)',
                        borderColor: 'rgba(79, 172, 254, 1)',
                        borderWidth: 1,
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { 
                            beginAtZero: true, 
                            title: { display: true, text: '事故件数' },
                            ticks: { stepSize: 1 } 
                        }
                    }
                }
            });
        } else {
            document.querySelector('.chart-container').innerHTML = '<p style="padding-top:130px; color:#999;">データがありませんでした</p>';
        }
    </script>
</body>
</html>
