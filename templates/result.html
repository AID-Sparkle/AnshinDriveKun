<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>診断結果</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        #map { height: 400px; width: 100%; background-color: #f0f0f0; margin-top: 20px; }
        #chart-container {
            width: 90%; max-width: 600px; height: 400px;
            margin: 20px auto; background-color: white; padding: 10px;
            border-radius: 8px; border: 3px solid #007bff; position: relative;
        }
        .no-data-msg {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #888; font-weight: bold;
        }
        body { font-family: sans-serif; text-align: center; margin: 20px; padding: 0; }
        ul { list-style: none; padding: 0; }
        a { display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>診断結果</h1>
    <p>以下の条件で絞り込みました：</p>

    <ul>
        <li>時間帯: {{ time }}</li>
        <li>年齢: {{ age }}</li>
        <li>車種: {{ vehicle }}</li>
        <li>天候: {{ weather }}</li>
    </ul>

    <div id="chart-container">
        <canvas id="myChart"></canvas>
    </div>

    <h2>周辺の地図</h2>
    <div id="map"></div>

    <a href="/">戻る</a>

    <script>
        const chartLabels = {{ chart_labels | tojson }};
        const chartData = {{ chart_data | tojson }};
        const chartContainer = document.getElementById('chart-container');

        const totalCount = chartData.reduce((sum, num) => sum + num, 0);

        if (totalCount > 0) {
            const ctx = document.getElementById('myChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: chartLabels.map(h => h + '時'),
                    datasets: [{
                        label: '事故件数',
                        data: chartData,
                        backgroundColor: 'rgba(54, 162, 235, 0.6)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, title: { display: true, text: '件数' }, suggestedMax: 5 }
                    }
                }
            });
        } else {
            document.getElementById('myChart').remove();
            chartContainer.innerHTML = '<p class="no-data-msg">条件に一致するデータがありませんでした。</p>';
        }
    </script>

    <script>
        function initMap() {
            const defaultLocation = { lat: 35.685175, lng: 139.7528 };
            const map = new google.maps.Map(document.getElementById("map"), {
                zoom: 14,
                center: defaultLocation
            });
            new google.maps.Marker({ position: defaultLocation, map: map });
        }
    </script>
    <script 
        src="https://maps.googleapis.com/maps/api/js?key={{ api_key }}&callback=initMap" 
        async defer>
    </script>
</body>
</html>
