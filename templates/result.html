<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>診断結果</title>
    <style>
        /* 地図を表示するdivのスタイルを指定 */
        #map {
            height: 400px;  /* 高さを指定 (例: 400px) */
            width: 100%;    /* 幅を指定 (例: 100%) */
            background-color: #f0f0f0; /* 地図が読み込まれるまでの背景色 */
            margin-top: 20px;
        }
        body {
            font-family: sans-serif;
            margin: 20px;
            padding: 0;
        }
        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>診断結果</h1>
    <p>以下の内容を受け取りました：</p>

    <ul>
        <li>運転する時間帯: {{ time }}</li>
        <li>年齢: {{ age }}</li>
        <li>性別: {{ gender }}</li>
        <li>天候: {{ weather }}</li>
    </ul>

    <!-- ★テスト用：緯度経度表示（本番で削除OK） -->
    <h3>（テスト表示）取得した現在位置：</h3>
    <p id="coords">位置情報取得中…</p>

    <!-- 小数点削除後の緯度経度（CSV形式用） -->
    <li><strong>緯度（CSV形式）:</strong> {{ lat_clean }}</li>
    <li><strong>経度（CSV形式）:</strong> {{ lng_clean }}</li>

    <h2>周辺の地図</h2>
    <div id="map"></div>

    <a href="/">戻る</a>

<script>
    let map;

    function initMap() {
        const defaultLocation = { lat: 35.685175, lng: 139.7528 };

        map = new google.maps.Map(document.getElementById("map"), {
            zoom: 14,
            center: defaultLocation
        });

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const userLocation = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };

                    // ★ページに表示
                    document.getElementById("coords").innerText =
                        `緯度: ${userLocation.lat}, 経度: ${userLocation.lng}`;

                    // マップに反映
                    map.setCenter(userLocation);

                    new google.maps.Marker({
                        position: userLocation,
                        map: map,
                        title: "現在地"
                    });
                },
                () => {
                    document.getElementById("coords").innerText =
                        "⚠️ 位置情報が拒否されました。デフォルト位置を使用します。";
                }
            );
        } else {
            document.getElementById("coords").innerText =
                "⚠️ このブラウザは位置情報取得に対応していません。";
        }
    }
</script>

<script async
    src="https://maps.googleapis.com/maps/api/js?key={{api_key}}&callback=initMap">
</script>
</body>
</html>
